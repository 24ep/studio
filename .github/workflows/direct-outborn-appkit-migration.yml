name: Direct Outborn AppKit Migration

on:
  push:
    branches:
      - fix/direct-outborn-appkit-sdk

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Replace legacy AppKit package name
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete pkg.dependencies['@alphayard/appkit']
          pkg.dependencies['@outborn/appkit-sdk'] = '2.1.1'
          const sorted = Object.fromEntries(Object.entries(pkg.dependencies).sort(([a], [b]) => a.localeCompare(b)))
          pkg.dependencies = sorted
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          mapfile -d '' files < <(git grep -Ilz '@alphayard/appkit' -- ':!package.json' ':!package-lock.json' ':!.github/workflows/direct-outborn-appkit-migration.yml' || true)
          if ((${#files[@]})); then
            printf '%s\0' "${files[@]}" | xargs -0 sed -i 's|@alphayard/appkit|@outborn/appkit-sdk|g'
          fi
      - name: Refresh npm lockfile from Outborn Registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify canonical package routing
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n '@alphayard/appkit' -- ':!.github/workflows/direct-outborn-appkit-migration.yml'
          ! git grep -n 'account-directory-sdk-release-production.up.railway.app' -- ':!.github/workflows/direct-outborn-appkit-migration.yml'
          grep -q '"@outborn/appkit-sdk": "2.1.1"' package.json
          grep -q 'https://registry.outborn.co/@outborn/appkit-sdk/-/appkit-sdk-2.1.1.tgz' package-lock.json
          grep -q 'https://registry.outborn.co/@outborn/account-directory/-/outborn-account-directory-0.1.4.tgz' package-lock.json
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/direct-outborn-appkit-migration.yml'
          git commit -m 'refactor: use canonical Outborn AppKit SDK package'
          git push
