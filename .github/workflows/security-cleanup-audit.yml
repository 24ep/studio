name: Security and repository cleanup audit

on:
  push:
    branches: [audit/security-legacy-large-cleanup]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/security-legacy-large-cleanup
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global npm@11.6.2
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(deps): refresh security-patched lockfile'
            git push
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Dependency provenance
        run: npm ls @xmldom/xmldom js-yaml sharp swagger-ui-react minio csv-parse @tiptap/core nodemailer next || true
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit.json
          set -e
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'))
          const counts = audit.metadata?.vulnerabilities || {}
          console.log('NPM_AUDIT_COUNTS', JSON.stringify(counts))
          const order = ['critical','high','moderate','low','info']
          const vulns = Object.entries(audit.vulnerabilities || {})
            .map(([name,v]) => ({name, severity:v.severity, direct:Boolean(v.isDirect), range:v.range, via:(v.via||[]).map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range,severity:x.severity}), fixAvailable:v.fixAvailable}))
            .sort((a,b) => order.indexOf(a.severity)-order.indexOf(b.severity))
          for (const v of vulns) console.log('NPM_AUDIT_VULN', JSON.stringify(v))
          if ((counts.critical || 0) + (counts.high || 0) > 0) process.exit(1)
          NODE
      - name: Verify generated artifacts are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '^(\.codex|audit)/'; then
            echo 'Generated review artifacts are still tracked' >&2
            exit 1
          fi
          if git grep -n 'audit/' -- ':!audit/**' ':!.github/workflows/security-cleanup-audit.yml'; then
            echo 'Unexpected audit artifact reference remains' >&2
            exit 1
          fi
          if git grep -n '\.codex/' -- ':!.codex/**' ':!.github/workflows/security-cleanup-audit.yml'; then
            echo 'Unexpected Codex artifact reference remains' >&2
            exit 1
          fi
      - name: Largest tracked files
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = [x for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x]
          rows=[]
          for f in files:
            try: rows.append((os.path.getsize(f), f))
            except OSError: pass
          for size,path in sorted(rows, reverse=True)[:30]:
            print(f'LARGE_FILE {size} {path}')
          PY
      - name: Legacy artifact candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          files = [x for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x]
          legacy = re.compile(r'(^|/)(archive|backup|backups|tmp|temp|dist|coverage|test-results|playwright-report)(/|$)|\.(bak|old|orig|rej|tmp|log|zip|tar|tgz|dump|sqlite|sqlite3|db-journal)$', re.I)
          candidates=[f for f in files if legacy.search(f)]
          for f in candidates: print('LEGACY_CANDIDATE', f)
          if candidates: raise SystemExit(1)
          PY
