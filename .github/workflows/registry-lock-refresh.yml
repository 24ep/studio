name: Refresh Outborn registry lockfile

on:
  push:
    branches: [fix/outborn-registry-sdk-consumers]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/outborn-registry-sdk-consumers
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global npm@11.6.2
      - name: Regenerate lockfile using Outborn Registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify no Railway release tarballs remain
        run: |
          if grep -q 'account-directory-sdk-release-production.up.railway.app\|appkit-sdk-release-production.up.railway.app' package-lock.json; then
            echo 'Legacy Railway SDK tarball reference remains in package-lock.json' >&2
            exit 1
          fi
          grep -q 'registry.outborn.co' package-lock.json
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): refresh Outborn registry lockfile'
          git push
