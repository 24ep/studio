name: Canonical Outborn SDK migration

on:
  push:
    branches:
      - fix/canonical-outborn-sdk

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/canonical-outborn-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate legacy AppKit package and imports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -e '@alphayard/appkit' -- ':!package-lock.json' || true)
          if ((${#files[@]})); then
            python - "${files[@]}" <<'PY'
          import pathlib, sys
          for raw in sys.argv[1:]:
              path = pathlib.Path(raw)
              text = path.read_text()
              updated = text.replace('@alphayard/appkit', '@outborn/appkit-sdk')
              if updated != text:
                  path.write_text(updated)
                  print(path)
          PY
          fi
          node <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          delete pkg.dependencies['@alphayard/appkit']
          pkg.dependencies['@outborn/appkit-sdk'] = '2.1.1'
          pkg.dependencies['@outborn/account-directory'] = '0.1.4'
          pkg.dependencies = Object.fromEntries(Object.entries(pkg.dependencies).sort(([a], [b]) => a.localeCompare(b)))
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Regenerate Registry-backed lockfile
        env:
          OUTBORN_REGISTRY_TOKEN: ${{ secrets.OUTBORN_REGISTRY_TOKEN }}
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Enforce canonical Outborn Registry dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').dependencies['@outborn/appkit-sdk']")" = '2.1.1'
          test "$(node -p "require('./package.json').dependencies['@outborn/account-directory']")" = '0.1.4'
          if git grep -n -e '@alphayard/appkit' -e 'npm:@outborn/appkit-sdk' -e 'account-directory-sdk-release-production.up.railway.app' -- ':!.github/workflows/canonical-outborn-sdk-migrate.yml'; then
            echo 'Legacy AppKit/Account distribution reference remains' >&2
            exit 1
          fi
          node <<'NODE'
          const lock = require('./package-lock.json')
          const root = lock.packages[''].dependencies
          if (root['@outborn/appkit-sdk'] !== '2.1.1') throw new Error('lock root AppKit is not canonical')
          if (root['@outborn/account-directory'] !== '0.1.4') throw new Error('lock root Account Directory is not canonical')
          if (!lock.packages['node_modules/@outborn/appkit-sdk']) throw new Error('canonical AppKit lock entry missing')
          if (lock.packages['node_modules/@alphayard/appkit']) throw new Error('legacy AppKit alias lock entry remains')
          for (const name of ['node_modules/@outborn/appkit-sdk', 'node_modules/@outborn/account-directory']) {
            const resolved = lock.packages[name]?.resolved || ''
            if (!resolved.startsWith('https://registry.outborn.co/')) throw new Error(`${name} not resolved from Outborn Registry: ${resolved}`)
          }
          NODE

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/canonical-outborn-sdk-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes required'
            exit 0
          fi
          git commit -m 'Use canonical Outborn AppKit SDK package'
          git push origin HEAD:fix/canonical-outborn-sdk
